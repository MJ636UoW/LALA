# LALA System Configuration
system:
  name: "LALA"
  call_name: "LALA"
  voice_identity: "LALA"
  personality: "LALA"
  user_name: "Mandar"
  default_language: "en"
  supported_languages:
    - "en" # English
    - "hi" # Hindi
    - "mr" # Marathi

storage:
  root: "F:\\LALA"
  models: "F:\\LALA\\Models"
  ollama_models: "F:\\LALA\\OllamaModels"
  datasets: "F:\\LALA\\Datasets"
  memory: "F:\\LALA\\Memory"
  logs: "F:\\LALA\\Logs"
  cache: "F:\\LALA\\Cache"
  backups: "F:\\LALA\\Backups"

security:
  default_permission_level: "READ_ONLY"
  allow_privileged_execution: false

model_router:
  active_provider: "local"
  local_runtime: "ollama"
  cloud_fallback: false
  providers:
    local:
      type: "local"
      model_name: "qwen2.5:3b"
      endpoint: "http://127.0.0.1:11434"
      temperature: 0.7
      streaming: true
    mock_gemini:
      type: "gemini"
      model_name: "gemini-flash"
    mock_claude:
      type: "claude"
      model_name: "claude-3-5-sonnet"
    mock_openai:
      type: "openai_compatible"
      model_name: "gpt-4o"
