[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lala"
version = "0.1.0"
description = "LALA - Personal AI Operating Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mandar" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
lala = "lala.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lala*"]
